[model]
architecture = "ice_strategy_v3"
d_model = 384
n_heads = 8
n_layers = 6
d_ff = 1536
dropout = 0.10

[training]
mode = "bc"
device = "auto"
dtype = "fp16"
seed = 42

[bc]
supervision = "policy"
map_name = "[p2]Ice Island (2p)"
dataset_dir = "dataset"
cache_dir = "dataset/bc_cache_v4"
validation_fraction = 0.2
max_files = 0
epochs = 6
batch_size = 24
lr = 0.00012
weight_decay = 0.00001
action_type_coef = 1.0
coord_coef = 0.30
build_type_coef = 0.70
pool_coef = 0.75
queue_coef = 0.30
target_coef = 0.60
offset_coef = 0.40
noop_coef = 0.5
queue_hold_coef = 2.0
busy_hold_coef = 0.0
class_weight_power = 0.5
action_label_smoothing = 0.02
location_smoothing = 0.10
max_actions_per_replay = 512
max_replay_frames = 0
idle_sample_probability = 0.05
min_uid_match_rate = 0.9
ticks_per_step = 10
num_workers = 2
log_interval = 25
save_every_steps = 0
macro_coef = 0.25
option_coef = 0.10
opening_augmentation = 128

[paths]
save_dir = "models/ice_strategy_v3"
log_dir = "logs/ice_strategy_v3"
