[model]
d_model = 256
n_heads = 8
n_layers = 6
d_ff = 512
dropout = 0.1        # BC only; self-play forces 0.0 behaviour via eval/no-dropout paths

[training]
mode = "curriculum"
device = "auto"
dtype = "bf16"
seed = 42

[selfplay]
lr = 3.0e-4
gamma = 0.999          # long horizon: the win signal must reach early decisions
gae_lambda = 0.95
clip_eps = 0.2
value_coef = 0.5
entropy_coef = 0.01
rollout_steps = 64
minibatch_size = 128
epochs_per_update = 3
num_envs = 4
num_teams = 2          # >2 = FFA, command centers spawn on a circle
ticks_per_step = 10
starting_credits = 5000.0
speed_mult = 1.0
iterations = 1000
log_interval = 5
save_every_games = 10
save_every_steps = 0

[bc]
dataset_dir = "dataset"
max_files = 0
epochs = 5
batch_size = 64
lr = 1.0e-4
weight_decay = 1.0e-5
action_type_coef = 1.0
coord_coef = 1.0
build_type_coef = 0.5
queue_coef = 0.2
max_actions_per_replay = 0
ticks_per_step = 10
num_workers = 8
log_interval = 50
save_every_steps = 500

[curriculum]
bc_epochs = 3
selfplay_iterations = 500

# Attrition-centric reward: the goal is to beat every opponent.
# Dense signal   = damage dealt to enemies + build cost of enemy units killed,
#                  mirrored for own losses (uid-tracked, so enemy production
#                  and repairs never leak into the signal).
# Sparse signal  = eliminating an enemy CC, losing your own CC, final victory.
[reward]
dmg_dealt_coef = 0.0001    # per hp of damage dealt to any enemy team
dmg_taken_coef = 0.0001
kill_cost_coef = 0.0002    # per credit of enemy unit value destroyed
loss_cost_coef = 0.0002
credits_coef = 0.00002     # small economy shaping
step_penalty = 0.0005      # discourages stalling
elim_bonus = 1.0           # an enemy team's CC destroyed (any surviving team)
cc_death_penalty = -5.0
win_bonus = 5.0            # sole survivor of the match

[paths]
save_dir = "models"
log_dir = "logs"
